downstream_coverage:
- id: screen_to_mock
  description: 画面の正はキャンバス（04_design/canvas・D-128.23）。キャンバスの画面とページがそろい、行き先が切れていない（前の見本 06_mockup/v1 はしまった・D-128.117・K-45）
  upstream:
    file: 05_flow/flow.json
    json_path: $.screens[?(@.release=='v1')].id
  downstream:
    glob: 04_design/canvas/*.dc.html
  severity: error
  command: python3 scripts/ci/canvas_gate.py
- id: act_to_screen
  description: 全行為に画面が割り当たっている
  upstream:
    file: 05_flow/flow.json
    json_path: $.backbone[*].acts[*].id
  downstream:
    file: 05_flow/flow.json
    json_path: $.act_to_screen
    as: key
  severity: error
  command: python3 scripts/ci/flow_gate.py --choke 03_architecture/choke-points.json
- id: object_to_table
  description: flow.json の全オブジェクトに ER 図のテーブル（実体）がある（G20）
  upstream:
    file: 05_flow/flow.json
    json_path: $.objects[*].name
  downstream:
    file: 03_architecture/ER図.md
    note: 「## オブジェクト ↔ テーブル」の表
  severity: error
  command: python3 scripts/ci/er_gate.py --flow 05_flow/flow.json --er 03_architecture/ER図.md
- id: screen_to_feature
  description: 画面が機能分解に到達している
  upstream:
    file: 05_flow/flow.json
    json_path: $.screens[*].id
  downstream:
    file: 07_functional/screens.json
    json_path: $.screens[*].id
  severity: error
  command: python3 scripts/ci/fb_gate.py --flow 05_flow/flow.json --er 03_architecture/ER図.md --dir 07_functional
- id: act_to_endpoint
  description: 全行為（v1）に endpoint が 1 本以上・全画面の必要 API がカバー・逆カバレッジ（G2）
  upstream:
    file: 05_flow/flow.json
    json_path: $.backbone[*].acts[*].id
  downstream:
    file: 08_api/endpoints.json
    json_path: $.endpoints[*].acts[*]
  severity: error
  command: python3 scripts/ci/api_gate.py --flow 05_flow/flow.json --dir 08_api
- id: act_to_feature_v3
  description: 第1フェーズの行為が、どれかの Kaname を作るチケット（11_tickets）の画面にある（前の機能の分解 09_features はしまった・D-128.114・K-45）
  upstream:
    file: 05_flow/flow.json
    json_path: $.backbone[*].acts[*].id
  downstream:
    file: 11_tickets/tickets.json
    json_path: $.tickets[*].screens[*]
  severity: error
  command: python3 scripts/tickets/coverage_gate.py --only KC3
- id: feature_to_ticket
  description: 第1フェーズの画面・契約の API・行為・関門が、Kaname を作るチケット（11_tickets）に漏れなく入る（KC1〜KC8。前の作業カード 07_tasks はしまった・D-128.114・K-45）
  upstream:
    file: 08_api/endpoints.json
    json_path: $.endpoints[*].operationId
  downstream:
    file: 11_tickets/tickets.json
    json_path: $.tickets[*].apis[*]
  severity: error
  command: python3 scripts/tickets/coverage_gate.py
dependency_boundaries:
  file: 03_architecture/dependency-boundaries.json
  ledger: 03_architecture/portability-ledger.md
  checks:
  - kind: import_boundary
    note: allowed_paths の外から forbidden_import_patterns を呼んだら赤（型だけ・台帳の越境は許す）
    command: node scripts/ci/boundary.mjs --import
  - kind: vendor_sql
    note: auth.uid() / pgsodium / supabase_vault / pg_graphql が migration・query に出たら赤
    command: bash -c 'DATABASE_URL=${DATABASE_URL:-postgres://kaname_app:kaname_app@127.0.0.1:55433/kaname_dev} AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-postgres://kaname_auth:kaname_auth@127.0.0.1:55433/kaname_dev} pnpm -s ci:no-vendor-sql'
  - kind: license_boundary
    note: Open Core の ee/ を含むパスからの import は赤（Infisical / langfuse / litellm）
    command: node scripts/ci/boundary.mjs --license
  - kind: ledger_consistency
    note: portability-ledger.md の越境が実在し、台帳に無い越境が無い
    command: node scripts/ci/boundary.mjs --ledger
extension_points:
  file: 03_architecture/extension-points.json
  severity: warn
  note: 関門で守るため、拡張点の列挙漏れは事故にならない（choke-points.md §5）
choke_points:
  file: 03_architecture/choke-points.json
  exceptions: 03_architecture/choke-point-exceptions.md
  checks:
  - id: H-1
    kind: bypass_detection
    note: 実装開始後に scripts/ci/choke-check.ts で有効化
  - id: H-2
    kind: no_dynamic_call
    note: 同上
  - id: H-3
    kind: exception_ledger
    note: choke-point-exceptions.md に未登録の迂回が無いこと
  - id: H-4
    kind: coverage
    note: 標準6関門＋固有関門が定義され ci_check を持つこと
flow_gate:
  file: 05_flow/flow.json
  command: python3 scripts/ci/flow_gate.py --choke 03_architecture/choke-points.json
  gates:
  - G1
  - G2
  - G3
  - G4
  - G5
  - G6
  - G7
  - G8
  - G9
  - G10
  severity: error
