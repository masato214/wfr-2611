          CI_SCOPE_INPUT: ${{ inputs.scope || 'full' }}
          CI_BASE_INPUT: ${{ inputs.base }}
          CI_TICKET_INPUT: ${{ inputs.ticket }}
        run: python3 scripts/ci/ci_scope.py --base "$CI_BASE_INPUT" --head HEAD --scope "$CI_SCOPE_INPUT" --ticket "$CI_TICKET_INPUT" --github-output "$GITHUB_OUTPUT"
