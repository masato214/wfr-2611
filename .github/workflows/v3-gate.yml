# .github/workflows/v3-gate.yml — Kaname CI ゲート 72 本（05_flow/build_testplan.py が生成。手で直さない）
# 方針: ゲートが緑を維持できないなら次のスライスに進まない。旧jobrainはCIが全ゲート赤のまま進み、それが死因の一つ。
# 段: static（静的・関門）→ database（実 Postgres・RLS・契約）／ unit-1〜unit-6（単体の試験を分けて同時に・それぞれ自分の Postgres）→ unit（合わせて coverage の閾値）／ spec・spec-2・spec-3（仕様の層・重い G56 と G67 を別の組に分けて同時に・K-323）／ task-gate（そのタスクの L1 行）→ auto-merge。staging を指す統合テスト（G15）はここに無い：別の定義 staging-e2e.yml を main から手で起こす（K-204）
# GitHub の上では自動で流さない（D-128.135）。CI はこの workflow をそのまま手元で act で流す（D-128.147・K-47）。GitHub では手で押したときだけ動く
# G0（static の 5 段目）：チケットの CI の範囲（K-107・D-128.169）。全部は scope=full（既定）。act_ci.sh が scope=auto・base を渡した回だけ、
#   unit-1〜6・database・web を影響の範囲に絞る（static・spec は毎回）。外から来る値は env で渡す（run の命令の文字に入れない）
name: v3-gate
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "CI の範囲（ticket＝そのチケットの中身だけ・full＝全部。全部は大分類の統合のときだけ・ticket-flow）"
        type: choice
        options: [ticket, full]
        default: full
      ticket:
        description: "チケットの番号（scope=ticket のとき。コミットのチケットの番号と違えば止める）"
        type: string
        default: ''
      base:
        description: "比べる元（40 桁のコミット。auto のときだけ使う）"
        type: string
        default: ''
      target:
        description: "取り込む先の枝の名前（G61 が比べる元の先祖かを確かめる。act_ci.sh が台の側で決めて渡す・枝の中のファイルから読まない・K-143）"
        type: string
        default: ''
      web:
        description: "画面の試験の組（web）を流すか。defer ならこの回は流さず、鎖の終わりに同じチケットの版でまとめて流す（ticket-flow の ci.py web）"
        type: choice
        options: [run, defer]
        default: run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
jobs:
  static:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux-vm"]') }}
    outputs:
      full: ${{ steps.scope.outputs.full }}
      unit: ${{ steps.scope.outputs.unit }}
      database: ${{ steps.scope.outputs.database }}
      web: ${{ steps.scope.outputs.web }}
      unit_shards: ${{ steps.scope.outputs.unit_shards }}
      unit_files: ${{ steps.scope.outputs.unit_files }}
      migration_files: ${{ steps.scope.outputs.migration_files }}
      coverage_args: ${{ steps.scope.outputs.coverage_args }}
      base: ${{ steps.scope.outputs.base }}
      gates: ${{ steps.scope.outputs.gates }}
      py_tests: ${{ steps.scope.outputs.py_tests }}
      web_g48: ${{ steps.scope.outputs.web_g48 }}
      web_g59: ${{ steps.scope.outputs.web_g59 }}
      web_gates: ${{ steps.scope.outputs.web_gates }}
      web_tasks: ${{ steps.scope.outputs.web_tasks }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { dest: '${{ runner.tool_cache }}/setup-pnpm' }   # 置き場は runner ごと（同じ台の runner が同時に ~/setup-pnpm を取り合う・K-172）
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }   # 自分の台は部品が台に残る：GitHub の cache に上げ下ろししない（K-172）
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5   # VM の Python は 3.12。GitHub の台と同じく版を用意する（K-173）
        with: { python-version: '3.14' }
      - run: bash scripts/ci/ci_venv.sh
      - name: "G0 チケットの CI の範囲（変えたファイル → 依存の地図 → 流す組と試験・K-107）"
        id: scope
        env:
          CI_SCOPE_INPUT: ${{ inputs.scope || 'full' }}
          CI_BASE_INPUT: ${{ inputs.base }}
          CI_TICKET_INPUT: ${{ inputs.ticket }}
        run: python3 scripts/ci/ci_scope.py --base "$CI_BASE_INPUT" --head HEAD --scope "$CI_SCOPE_INPUT" --ticket "$CI_TICKET_INPUT" --github-output "$GITHUB_OUTPUT"
      - name: "G1 lint"
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: "G2 type check"
        if: ${{ !cancelled() }}
        run: pnpm type-check
      - name: "G5 auth.uid() 検出 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:no-vendor-sql
      - name: "G7 import 境界検査 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:boundary
      - name: "G8 Open Core ee/ 検出"
        if: ${{ !cancelled() }}
        run: pnpm ci:license-boundary
      - name: "G9 ポータビリティ台帳の整合"
        if: ${{ !cancelled() }}
        run: pnpm ci:ledger-sync
      - name: "G10 動的クエリの文字列連結禁止 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:no-sql-concat
      - name: "G11 OpenAPI 破壊的変更検出"
        if: ${{ !cancelled() }}
        run: pnpm ci:openapi-diff
      - name: "G13 env 整合"
        if: ${{ !cancelled() }}
        run: pnpm ci:env-audit
      - name: "G14 AC validator（4-tier）"
        if: ${{ !cancelled() }}
        run: pnpm ci:ac-validate
      - name: "G16 関門C1 ネットワークの迂回検出 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke -- --id C1
      - name: "G17 関門C2 永続化の迂回検出 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke -- --id C2
      - name: "G18 関門C3 モデル呼び出しの迂回検出"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke -- --id C3
      - name: "G19 関門C4 ファイルの迂回検出"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke -- --id C4
      - name: "G20 関門C5 プロセス起動の迂回検出 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke -- --id C5
      - name: "G21 関門C6 通知の迂回検出"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke -- --id C6
      - name: "G22 関門C7 決済の迂回検出 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke -- --id C7
      - name: "G23 関門C8 秘密の迂回検出 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke -- --id C8
      - name: "G24 動的呼び出し禁止 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:no-dynamic-call && pnpm ci:test-imports
      - name: "G25 関門例外台帳の整合"
        if: ${{ !cancelled() }}
        run: pnpm ci:choke-exceptions
      - name: "G26 チケットの触る関門の宣言"
        if: ${{ !cancelled() }}
        run: pnpm ci:task-choke-declared
      - name: "G27 画面の route の生成物が最新（flow.json → apps/web/lib/routes.ts）"
        if: ${{ !cancelled() }}
        run: pnpm ci:routes
      - name: "G28 実ブラウザで押した証拠（操作要素 1 つ＝1 行。行 ID を名前に持つ Playwright が通っている）"
        if: ${{ !cancelled() }}
        run: pnpm ci:op-gate
      - name: "G39 外へ出る口の宛先（apps/bridge・apps/web の fetch は Kaname か Bridge の口だけ・関門 C1 の例外 X-009／X-010 の代替統制） [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:net-boundary && pnpm ci:net-boundary:selftest && pnpm ci:choke:selftest
      - name: "G40 ゼロトラストの決まり（設計の赤 0・実装の残りが記録より増えない） [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:zt
      - name: "G41 権限の試験（契約の全 API で、役が合わない人・ログインしていない人を止め、副作用に届かせない） [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:authz
      - name: "G42 契約の外の道すじが無い（登録した道すじ＝契約） [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:endpoints
      - name: "G43 秘密の混入（鍵・トークン・秘密鍵・パスワード入りの DB の URL・.env） [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:secret-scan
      - name: "G44 部品の弱点（本番で使う部品に high 以上の弱点が無い）"
        if: ${{ !cancelled() }}
        run: pnpm ci:deps-audit
      - name: "G45 Kaname を作るためのチケットの形（番号・親子 3 段・区画・決定 ID・先に要るもの）"
        if: ${{ !cancelled() }}
        run: pnpm ci:tickets
      - name: "G35 有限資源の静的検査（G-16：関門外の生クライアント・タイムアウト無し・冪等キー無しの書込）"
        if: ${{ !cancelled() }}
        run: pnpm ci:resource-static
      - name: "G66 コミットの名義がチームの物（本線との差分のコミットの author のメールのドメイン・K-206）"
        if: ${{ !cancelled() }}
        env:
          CI_BASE: ${{ steps.scope.outputs.base }}
        run: python3 scripts/ci/author_gate.py --base-ref "$CI_BASE"
      - name: "画面の型の確かめ（next typegen ＋ tsc・web=defer の回も画面の組み立ての型は流す。web=run の回は web の組の next build が同じ型を見る・K-631）"
        if: ${{ !cancelled() && steps.scope.outputs.web == 'true' && inputs.web != 'run' }}
        run: NEXT_DIST_DIR=.next-prod pnpm --filter @kaname/web exec next typegen && pnpm --filter @kaname/web exec tsc --noEmit

  database:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux-vm"]') }}
    needs: [static]
    if: ${{ !cancelled() && needs.static.outputs.database == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { dest: '${{ runner.tool_cache }}/setup-pnpm' }   # 置き場は runner ごと（同じ台の runner が同時に ~/setup-pnpm を取り合う・K-172）
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }   # 自分の台は部品が台に残る：GitHub の cache に上げ下ろししない（K-172）
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5   # VM の Python は 3.12。GitHub の台と同じく版を用意する（K-173）
        with: { python-version: '3.14' }
      - run: bash scripts/ci/ci_venv.sh
      - name: DB を立てる（組の中・空いている番号・K-172）
        env: { PG_NAME: "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" }
        run: |
          python3 scripts/ci/ci_db_sweep.py --keep "$PG_NAME"   # 台が落ちた回の残りを消す（6 時間を過ぎた kaname-ci- だけ）
          docker run -d --rm --name "$PG_NAME" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=kaname_test -p 127.0.0.1::5432 pgvector/pgvector:pg16 >/dev/null
          port=$(docker port "$PG_NAME" 5432/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 60); do docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
          docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q || { echo "★ DB が 60 秒で立ち上がらない"; exit 1; }
          { echo "PG_NAME=$PG_NAME"; echo "PGPORT=$port"; echo "DATABASE_URL=postgres://postgres:postgres@localhost:$port/kaname_test"; echo "DATABASE_URL_ADMIN=postgres://postgres:postgres@localhost:$port/kaname_test"; } >> "$GITHUB_ENV"
      - name: "G58 migration の lint（Squawk・変えた・足した migration だけ・K-107）"
        if: ${{ !cancelled() }}
        env:
          CI_MIGRATION_FILES: ${{ needs.static.outputs.migration_files }}
          CI_BASE: ${{ needs.static.outputs.base }}
        run: python3 scripts/ci/ci_scope.py run-squawk
      - name: "G4 RLS 全テーブル有効 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:rls-enabled
      - name: "G6 テナント文脈の網羅 [CRITICAL]"
        if: ${{ !cancelled() }}
        run: pnpm ci:context-set
      - name: "G12 実Postgresでmigration+seed適用"
        if: ${{ !cancelled() }}
        run: pnpm ci:migration-integration
      - name: "G33 RLS の場合表（access-matrix.json 全行）"
        if: ${{ !cancelled() }}
        run: pnpm ci:access-matrix -- --matrix 07_qa/test-plan/access-matrix.json
      - name: "G34 EARS → test の対応（mapping の test が全部存在）"
        if: ${{ !cancelled() }}
        run: pnpm ci:ears-mapping -- --mapping 07_qa/test-plan/ears-test-mapping.json
      - name: "G36 契約 fuzz（Schemathesis・openapi.yaml・作った口を本物の DB の上で叩く。答えの形の元の DB の列の書き出しも確かめる）"
        if: ${{ !cancelled() && (needs.static.outputs.full == 'true' || contains(needs.static.outputs.gates, ',36,')) }}
        run: pnpm ci:schemathesis
      - name: 準備の時間切れを見分ける（Hook timed out の赤を 1 行で出す・K-193）
        if: ${{ failure() }}
        run: python3 scripts/ci/hook_timeout.py note junit
      - name: DB を消す（赤でも必ず）
        if: always()
        run: docker rm -f "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >/dev/null 2>&1 || true

  unit-1:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux-vm"]') }}
    # 単体の試験の 1/6（自分の Postgres の上で。結果は unit が合わせる・D-128.140）。組の数・流す試験は static の G0 が決める（K-107）
    needs: [static]
    if: ${{ !cancelled() && needs.static.outputs.unit == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { dest: '${{ runner.tool_cache }}/setup-pnpm' }   # 置き場は runner ごと（同じ台の runner が同時に ~/setup-pnpm を取り合う・K-172）
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }   # 自分の台は部品が台に残る：GitHub の cache に上げ下ろししない（K-172）
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5   # VM の Python は 3.12。GitHub の台と同じく版を用意する（K-173）
        with: { python-version: '3.14' }
      - run: bash scripts/ci/ci_venv.sh
      - name: DB を立てる（組の中・空いている番号・K-172）
        env: { PG_NAME: "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" }
        run: |
          python3 scripts/ci/ci_db_sweep.py --keep "$PG_NAME"   # 台が落ちた回の残りを消す（6 時間を過ぎた kaname-ci- だけ）
          docker run -d --rm --name "$PG_NAME" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=kaname_test -p 127.0.0.1::5432 pgvector/pgvector:pg16 >/dev/null
          port=$(docker port "$PG_NAME" 5432/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 60); do docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
          docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q || { echo "★ DB が 60 秒で立ち上がらない"; exit 1; }
          { echo "PG_NAME=$PG_NAME"; echo "PGPORT=$port"; echo "DATABASE_URL=postgres://postgres:postgres@localhost:$port/kaname_test"; echo "DATABASE_URL_ADMIN=postgres://postgres:postgres@localhost:$port/kaname_test"; } >> "$GITHUB_ENV"
      - name: "G3.1 単体の試験の 1 組目（自分の DB の上で。coverage の閾値は合わせた後に当てる）"
        if: ${{ !cancelled() }}
        env:
          CI_UNIT_FILES: ${{ needs.static.outputs.unit_files }}
          CI_COVERAGE_ARGS: ${{ needs.static.outputs.coverage_args }}
          CI_UNIT_SHARDS: ${{ needs.static.outputs.unit_shards }}
        run: python3 scripts/ci/ci_scope.py run-unit --shard 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: vitest-blob-1, path: .vitest-reports/, include-hidden-files: true, retention-days: 1 }
      - name: 準備の時間切れを見分ける（Hook timed out の赤を 1 行で出す・K-193）
        if: ${{ failure() }}
        run: python3 scripts/ci/hook_timeout.py note junit
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-unit-1, path: junit/, if-no-files-found: error, retention-days: 7 }
      - name: DB を消す（赤でも必ず）
        if: always()
        run: docker rm -f "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >/dev/null 2>&1 || true
  unit-2:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux-vm"]') }}
    # 単体の試験の 2/6（自分の Postgres の上で。結果は unit が合わせる・D-128.140）。組の数・流す試験は static の G0 が決める（K-107）
    needs: [static]
    if: ${{ !cancelled() && needs.static.outputs.unit == 'true' && fromJSON(needs.static.outputs.unit_shards) >= 2 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { dest: '${{ runner.tool_cache }}/setup-pnpm' }   # 置き場は runner ごと（同じ台の runner が同時に ~/setup-pnpm を取り合う・K-172）
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }   # 自分の台は部品が台に残る：GitHub の cache に上げ下ろししない（K-172）
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5   # VM の Python は 3.12。GitHub の台と同じく版を用意する（K-173）
        with: { python-version: '3.14' }
      - run: bash scripts/ci/ci_venv.sh
      - name: DB を立てる（組の中・空いている番号・K-172）
        env: { PG_NAME: "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" }
        run: |
          python3 scripts/ci/ci_db_sweep.py --keep "$PG_NAME"   # 台が落ちた回の残りを消す（6 時間を過ぎた kaname-ci- だけ）
          docker run -d --rm --name "$PG_NAME" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=kaname_test -p 127.0.0.1::5432 pgvector/pgvector:pg16 >/dev/null
          port=$(docker port "$PG_NAME" 5432/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 60); do docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
          docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q || { echo "★ DB が 60 秒で立ち上がらない"; exit 1; }
          { echo "PG_NAME=$PG_NAME"; echo "PGPORT=$port"; echo "DATABASE_URL=postgres://postgres:postgres@localhost:$port/kaname_test"; echo "DATABASE_URL_ADMIN=postgres://postgres:postgres@localhost:$port/kaname_test"; } >> "$GITHUB_ENV"
      - name: "G3.2 単体の試験の 2 組目（自分の DB の上で。coverage の閾値は合わせた後に当てる）"
        if: ${{ !cancelled() }}
        env:
          CI_UNIT_FILES: ${{ needs.static.outputs.unit_files }}
          CI_COVERAGE_ARGS: ${{ needs.static.outputs.coverage_args }}
          CI_UNIT_SHARDS: ${{ needs.static.outputs.unit_shards }}
        run: python3 scripts/ci/ci_scope.py run-unit --shard 2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: vitest-blob-2, path: .vitest-reports/, include-hidden-files: true, retention-days: 1 }
      - name: 準備の時間切れを見分ける（Hook timed out の赤を 1 行で出す・K-193）
        if: ${{ failure() }}
        run: python3 scripts/ci/hook_timeout.py note junit
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-unit-2, path: junit/, if-no-files-found: error, retention-days: 7 }
      - name: DB を消す（赤でも必ず）
        if: always()
        run: docker rm -f "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >/dev/null 2>&1 || true
  unit-3:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux-vm"]') }}
    # 単体の試験の 3/6（自分の Postgres の上で。結果は unit が合わせる・D-128.140）。組の数・流す試験は static の G0 が決める（K-107）
    needs: [static]
    if: ${{ !cancelled() && needs.static.outputs.unit == 'true' && fromJSON(needs.static.outputs.unit_shards) >= 3 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { dest: '${{ runner.tool_cache }}/setup-pnpm' }   # 置き場は runner ごと（同じ台の runner が同時に ~/setup-pnpm を取り合う・K-172）
      - uses: actions/setup-node@v4
