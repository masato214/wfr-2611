          port=$(docker port "$PG_NAME" 5432/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 60); do docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
