      API_BASE: http://127.0.0.1:3011
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:3011
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: ${{ github.workspace }}/junit/web.xml   # 絶対の道（Playwright は設定の置き場 apps/web からの道で読む・K-176）
      # 試験用の受け箱（apps/web/tests/_lib/mailbox.ts・K-54）。API は Resend の SDK の行き先（RESEND_BASE_URL）をここにして、本物の送出の道でメールを出す
      QA_MAILBOX_PORT: '3191'
      # 規約・プライバシーポリシーの文面のページ（K-53）が埋める値。試験の値（本番の値は K-85・K-86 が決める）
      OPERATOR_ADDRESS: 東京都千代田区試験 1-1
      LEGAL_COURT: 東京地方裁判所
      LEGAL_HOSTING_PROVIDER: 試験のホスティング
      LEGAL_MAIL_PROVIDER: 試験のメール
      LEGAL_SECRETS_PROVIDER: 試験の秘密の置き場
      LEGAL_STORAGE_PROVIDER: 試験の置き場
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { dest: '${{ runner.tool_cache }}/setup-pnpm' }   # 置き場は runner ごと（同じ台の runner が同時に ~/setup-pnpm を取り合う・K-172）
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }   # 自分の台は部品が台に残る：GitHub の cache に上げ下ろししない（K-172）
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5   # VM の Python は 3.12。GitHub の台と同じく版を用意する（K-173）
        with: { python-version: '3.14' }
      - run: bash scripts/ci/ci_venv.sh
      - name: DB を立てる（組の中・空いている番号・K-172）
        env: { PG_NAME: "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" }
        run: |
          python3 scripts/ci/ci_db_sweep.py --keep "$PG_NAME"   # 台が落ちた回の残りを消す（6 時間を過ぎた kaname-ci- だけ）
          docker run -d --rm --name "$PG_NAME" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=kaname_test -p 127.0.0.1::5432 pgvector/pgvector:pg16 >/dev/null
          port=$(docker port "$PG_NAME" 5432/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 60); do docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
          docker exec "$PG_NAME" pg_isready -h 127.0.0.1 -U postgres -q || { echo "★ DB が 60 秒で立ち上がらない"; exit 1; }
          { echo "PG_NAME=$PG_NAME"; echo "PGPORT=$port"; echo "DATABASE_URL=postgres://postgres:postgres@localhost:$port/kaname_test"; echo "DATABASE_URL_ADMIN=postgres://postgres:postgres@localhost:$port/kaname_test"; } >> "$GITHUB_ENV"
      - run: pnpm --filter @kaname/web exec playwright install --with-deps chromium   # 像の温めと同じ・字体と apt の部品をそろえる（K-641）
      - name: 台の道具をそろえる（lsof・入っていれば飛ばす・K-641）
        run: command -v lsof >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq lsof; }
      - name: 画面と口の番号が空いているか（手元の開発のサーバーに当たって古いコードで緑にしない・K-172）
        run: |
          for port in 3011 3124 3191; do if lsof -ti tcp:$port >/dev/null 2>&1; then echo "★ 番号 $port が使われている（手元の開発のサーバーなど）。止めてから流し直す"; exit 1; fi; done
          echo "KANAME_API_LOG=$RUNNER_TEMP/api.log" >> "$GITHUB_ENV"   # 口の記録の置き場（画面の試験が読む・回ごとの置き場）
      - name: DB に migration を当て、API を立ち上げる（本物の口の画面の試験・K-53。メールは試験用の受け箱へ・K-54）
        run: |
          pnpm db:migrate
          (env NODE_ENV=development PORT=3011 BASE_URL=http://127.0.0.1:3011 WEB_BASE_URL=http://127.0.0.1:3124             DATABASE_URL=postgres://kaname_app:kaname_app@localhost:$PGPORT/kaname_test             AUTH_DATABASE_URL=postgres://kaname_auth:kaname_auth@localhost:$PGPORT/kaname_test             AUTH_SECRET=ci-web-secret-0123456789-abcdefghijklmnop SECRETS_MASTER_KEY=BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=             STORAGE_ENDPOINT=http://127.0.0.1:9000 STORAGE_REGION=ap-northeast-1 STORAGE_BUCKET=kaname-ci STORAGE_ACCESS_KEY_ID=ci STORAGE_SECRET_ACCESS_KEY=ci             KANAME_DEV_FAKE_BUCKET=1 KANAME_DEV_STORAGE_DIR=$RUNNER_TEMP/kaname-storage             RESEND_API_KEY=re_qa_mailbox RESEND_BASE_URL=http://127.0.0.1:3191             pnpm exec tsx apps/api/src/dev.ts > $RUNNER_TEMP/api.log 2>&1 & echo $! > $RUNNER_TEMP/api.pid)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3011/health && exit 0; sleep 2; done
          cat $RUNNER_TEMP/api.log; exit 1
      - run: pnpm --filter @kaname/web build:test
      - name: 画面を立ち上げる
        run: |
          (pnpm --filter @kaname/web start:test > $RUNNER_TEMP/web.log 2>&1 & echo $! > $RUNNER_TEMP/web.pid)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3124/dev/k/showcase && exit 0; sleep 2; done
          cat $RUNNER_TEMP/web.log; exit 1
      - name: Bridge を組み立てる（配布と同じ build・専用の段 G73 が使う・K-379）
        run: pnpm --filter @kaname/bridge build
      - name: "G48 新しい画面の実ブラウザの試験と、押した証拠（本番の形で組み立てた画面の上・行 ID の試験が全部の行で通る・記録なし・K-36。今の回の報告から結果の記録を作り、結果が空の行は今の回の報告で確かめる・K-143）"
        if: ${{ !cancelled() }}
        env:
          CI_FULL: ${{ needs.static.outputs.full }}
          CI_WEB_SPECS: ${{ needs.static.outputs.web_g48 }}
          CI_WEB_OTHER: ${{ needs.static.outputs.web_g59 }}
          CI_WEB_TASKS: ${{ needs.static.outputs.web_tasks }}
          CI_WEB_GATES: ${{ needs.static.outputs.web_gates }}
        run: BASE_URL=http://127.0.0.1:3124 python3 scripts/ci/web_run.py g48
      - name: "G59 中間テスト（いくつかのチケットを合わせた一続きの操作・本物のブラウザと本物の口と DB・試験用の受け箱・K-54 から）"
        if: ${{ !cancelled() }}
        env:
          CI_FULL: ${{ needs.static.outputs.full }}
          CI_WEB_SPECS: ${{ needs.static.outputs.web_g59 }}
          CI_WEB_OTHER: ${{ needs.static.outputs.web_g48 }}
          CI_WEB_GATES: ${{ needs.static.outputs.web_gates }}
        run: PLAYWRIGHT_JUNIT_OUTPUT_NAME="$GITHUB_WORKSPACE/junit/web-skeleton.xml" BASE_URL=http://127.0.0.1:3124 python3 scripts/ci/web_run.py g59
      - name: "G70 キャンバスとの見た目の突き合わせ（入れた組・幅ごと・値の読み方を data: の頁で確かめる・K-238）"
        if: ${{ !cancelled() }}
        env:
          CI_FULL: ${{ needs.static.outputs.full }}
          CI_WEB_GATES: ${{ needs.static.outputs.web_gates }}
          CI_WEB_SPECS: ${{ needs.static.outputs.web_g48 }}
          CI_WEB_OTHER: ${{ needs.static.outputs.web_g59 }}
        run: PLAYWRIGHT_JUNIT_OUTPUT_NAME="$GITHUB_WORKSPACE/junit/web-fidelity.xml" BASE_URL=http://127.0.0.1:3124 python3 scripts/ci/web_run.py gate 70
      - name: "G73 Bridge の輪が Chrome を動かす通しの画面の試験（組み立てた Bridge・頭なしの Chrome・的のログイン画面・K-379）"
        if: ${{ !cancelled() }}
        env:
          CI_FULL: ${{ needs.static.outputs.full }}
          CI_WEB_GATES: ${{ needs.static.outputs.web_gates }}
          CI_WEB_SPECS: ${{ needs.static.outputs.web_g48 }}
          CI_WEB_OTHER: ${{ needs.static.outputs.web_g59 }}
        run: PLAYWRIGHT_JUNIT_OUTPUT_NAME="$GITHUB_WORKSPACE/junit/web-bridge.xml" BASE_URL=http://127.0.0.1:3124 python3 scripts/ci/web_run.py gate 73
      - uses: actions/upload-artifact@v4
        # 結果の記録（G48 の record が書く）。緑の回にこそ要る：取り込みの台本（pm_merge.sh）がここから写して結果の欄を書く（K-143・D-129.51）
        if: ${{ !cancelled() }}
        with: { name: ci-results, path: 07_qa/ci-results/, if-no-files-found: error, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-web, path: junit/, if-no-files-found: error, retention-days: 7 }
      - name: 立てた API と画面を止める（赤でも必ず・Mac の台は残るので次の回が古いサーバーに当たらないように）
        if: always()
        run: |
          bash scripts/ci/kill_tree.sh "$RUNNER_TEMP/api.pid" "$RUNNER_TEMP/web.pid"   # 孫以下（node・next-server）まで
          # 始める前に空いていた番号なので、今いるのはこの回の残り。残れば赤（次の回が古いサーバーに当たらないように）
          for port in 3011 3124 3191; do if lsof -ti tcp:$port >/dev/null 2>&1; then echo "★ 止めた後も番号 $port が使われている"; exit 1; fi; done
      - name: DB を消す（赤でも必ず）
        if: always()
        run: docker rm -f "kaname-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >/dev/null 2>&1 || true
  junit:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux-vm"]') }}
    # 試験の組の JUnit を 1 つの artifact「junit」にまとめる（ticket-flow の ci.py が読む・K-172）。落ちた組があってもまとめる
    needs: [unit-1, unit-2, unit-3, unit-4, unit-5, unit-6, spec, spec-2, spec-3, web]
    if: always()
    steps:
      - uses: actions/upload-artifact/merge@v4
        with: { name: junit, pattern: junit-*, delete-merged: false }
  auto-merge:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux-vm"]') }}
    needs: [static, database, unit, spec, spec-2, spec-3, task-gate]
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-auto-merge')
    permissions: { contents: write, pull-requests: write }
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
